# =================================================================
#   HYPERDESK PRODUCTION COTURN STUN/TURN SERVER CONFIGURATION
# =================================================================

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Realm & Server Identity
realm=turn.hyperdesk.io
server-name=hyperdesk-turn-cluster

# Authentication (REST API HMAC / Static Secret)
use-auth-secret
static-auth-secret=HyperDeskProductionTurnSecret2026!

# Fingerprint & Security
fingerprint
lt-cred-mech

# Allow UDP, TCP and TLS relay allocations
no-stdout-log
log-file=/var/log/turnserver/turnserver.log
verbose

# Rate Limiting & Bandwidth Capping per Peer Connection
user-quota=100
total-quota=10000
max-bps=50000000

# TLS Certificate Paths
# cert=/etc/letsencrypt/live/turn.hyperdesk.io/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.hyperdesk.io/privkey.pem

# Allowed Cipher Suites
cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
